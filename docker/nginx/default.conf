# Configuración de Nginx como proxy hacia PHP-FPM.
# Nginx recibe las peticiones HTTP y se las pasa al contenedor 'app'
# (PHP-FPM) por el puerto 9000, usando el protocolo FastCGI.

server {
    listen 80;

    # 'public' es la carpeta raíz de Laravel: ahí vive index.php,
    # que es el punto de entrada de TODA la aplicación.
    root /var/www/public;

    index index.php index.html;

    # Cabeceras básicas de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Rutas normales (CSS, JS, imágenes, etc.): si el archivo existe, se sirve;
    # si no, se redirige todo a index.php (esto es lo que permite que
    # Laravel maneje el "routing" de toda la app).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cualquier petición a un archivo .php se reenvía a PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquea el acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}